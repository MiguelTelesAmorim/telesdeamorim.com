<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f7f5f5;
  --ink: #1d1819;
  --muted: #6b6163;
  --accent: #7a1f3d;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171314;
    --ink: #efe9ea;
    --muted: #a3979a;
    --accent: #e28ea6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.5;
  display: flex;
  align-items: center;
}
main {
  width: 100%;
  max-width: 60rem;
  margin: 0 auto;
  padding: 2rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.75rem, 12vw, 6rem);
  line-height: 0.95;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
.rule { width: 4.5rem; height: 4px; background: var(--accent); }
p { margin: 0; max-width: 30rem; font-size: clamp(1.15rem, 3.2vw, 1.4rem); color: var(--muted); }
.next {
  align-self: flex-start;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.05rem, 2.8vw, 1.25rem);
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}
.next:hover { text-decoration-thickness: 2px; }
.next:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>Under construction</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>This site is being built. Please check back soon.</p>
  <a class="next" href="/travel/">Meanwhile, travel memories: 37 countries in photographs &#8594;</a>
</main>
</body>
</html>
